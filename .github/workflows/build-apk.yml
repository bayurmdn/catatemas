name: Build APK

on:
  push:
    paths-ignore:
      - 'release/**'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      # Optional: add repository secret CATATEMAS_KEYSTORE_BASE64 (base64 of the .jks file)
      # so CI builds use the same signature as the installed APK. Without it, CI uses a debug key.
      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.CATATEMAS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/catatemas.jks
          fi
      - name: Build release APK
        env:
          CATATEMAS_STORE_PASSWORD: ${{ secrets.CATATEMAS_STORE_PASSWORD }}
          CATATEMAS_KEY_PASSWORD: ${{ secrets.CATATEMAS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CatatEmas-apk
          path: app/build/outputs/apk/release/app-release.apk
